; ThaiFontFix settings for the local version.dll proxy.

[FontFix]
; Set to 0 to turn off the Thai bitmap-font hooks.
Enabled=1

; Center combining marks over the preceding base glyph.
CenterMarks=1

; Raise a tone mark by this many pixels when a vowel mark was drawn first.
ToneMarkRaise=2

; Highest font-spacing value (0-8) that the fix will compensate for.
MaxExtraSpacing=8

; Write hook startup status to version-thaifnt.log and a debugger's output window.
DebugLog=1
